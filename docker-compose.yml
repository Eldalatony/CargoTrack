name: cargotrack

# Local development stack.
#
# Design rule (Gate 1 / roadmap "Environment portability"):
#   No service hostname is hardcoded in application code or in this file's
#   application config. The app reads DATABASE_URL and REDIS_URL from the
#   environment only. Locally those come from .env; in production the platform
#   (Railway / VPS) injects them. Identical application code, both places.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cargotrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cargotrack

  redis:
    image: redis:7-alpine
    container_name: cargotrack-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cargotrack

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: cargotrack-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-4000}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH:-/app/storage}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SEED_ON_START: ${SEED_ON_START:-false}
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - file_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - cargotrack

  # Same image as backend, different entrypoint. Consumes the BullMQ queues
  # that every status transition enqueues (roadmap Phase 4).
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: cargotrack-worker
    restart: unless-stopped
    # Bypasses the migration entrypoint: the backend service owns migrations,
    # and two containers racing for the advisory lock is a startup hazard.
    entrypoint: ["dumb-init", "--"]
    command: ["npm", "run", "start:worker:dev"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH:-/app/storage}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-4001}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - file_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:$$WORKER_HEALTH_PORT/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - cargotrack

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: cargotrack-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${FRONTEND_PORT:-3000}
      # Resolved in the browser, so it must be a host-reachable URL, never a
      # Compose DNS name.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - cargotrack

volumes:
  postgres_data:
  redis_data:
  file_storage:
  backend_node_modules:
  frontend_node_modules:
  frontend_next_cache:

networks:
  cargotrack:
    driver: bridge
